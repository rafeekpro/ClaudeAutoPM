# copilot-review-gate — keep a PR YELLOW until GitHub Copilot has code-reviewed it.
#
# GENERATED from lagowski/pr-review-gate (templates/copilot-review-gate.yml) — do not
# edit in place; change the template and re-deploy. Only "ubuntu-latest" is per-repo.
#
# Native Copilot code review is ADVISORY: it posts a review (as
# `copilot-pull-request-reviewer`) but never a status check, so branch protection
# has nothing to wait on and a PR can go green before Copilot ever looks at it.
# This gate synthesises the missing `copilot-review` status check:
#   * `pull_request` (open / push / ready): post `copilot-review` = pending unless
#     Copilot has already reviewed the current head commit -> success.
#   * `schedule` backstop: re-evaluate every open PR and flip to success once a
#     Copilot review for the current head has landed.
# Make `copilot-review` a REQUIRED status check and merge is blocked while yellow.
#
# WHY A SCHEDULE, NOT the review event: a run triggered by Copilot submitting its
# review (`pull_request_review`) is bot-initiated, and GitHub holds bot-triggered
# runs as `action_required` — they never execute and can't be API-approved
# ("not from a fork pull request or queued by the Actions bot"). So we can't green
# on the review event; the cron backstop is the reliable greener. The block is
# always correct regardless of latency: pending == not-yet-reviewed == not mergeable.
#
# TRIGGER for the review itself: Copilot can't be requested via REST (422). It is
# AUTO-requested by the separate `copilot-auto-review` branch ruleset
# (`copilot_code_review`, review_on_push), deployed by the same tool — this gate
# only waits for that review.
#
# Gates on "Copilot has reviewed", NOT "findings resolved" — that stays
# required_conversation_resolution + human approval (the option-A flow).
#
# WHEN COPILOT STOPS REVIEWING (#311). `copilot-review` is a REQUIRED check whose
# producer is a metered third-party service on an AI-credit budget. If Copilot stops
# reviewing — budget exhausted, outage, or a PR it simply never picks up — the check
# would stay yellow forever and NOTHING in the repository could clear it. Copilot cannot
# be asked directly either: POST /pulls/N/requested_reviewers answers 422, because the
# bot is not a collaborator. Observed 2026-07-28 in this fleet: CI green, no review on two
# successive head commits, 30+ minutes each, at 75% of a $10 monthly AI-credit allowance.
# Pushing an empty commit does not help either — a new SHA with no diff does not wake the
# reviewer, and a draft is never reviewed at all.
#
# So the gate distinguishes "not reviewed yet" from "not going to be reviewed":
#   * under COPILOT_REVIEW_STALE_MIN (default 60) -> pending, "Waiting for Copilot…"
#   * past it                                     -> FAILURE, naming the wait and the
#                                                    budget as the thing to check
#   * label `copilot-review-unavailable`          -> success, and the description says
#                                                    plainly that Copilot did NOT review
#
# AND FROM "reviewed" ITSELF (#200). Out of credit, Copilot does not go quiet — it SUBMITS a
# review whose body says it could not review, in state COMMENTED, on the right commit. Counted
# as a review it produced `success — "Copilot has reviewed this commit"` about a commit nobody
# had looked at: 13 PRs on one repo in one day, four of them production promotions. So a review
# that says it is not a review is not one, and because that is an ANSWER rather than silence it
# goes to FAILURE immediately, without waiting out a clock that measures patience.
#
# The failure is not a verdict on the code; it is the gate refusing to keep spinning about
# something that will not resolve itself. And the label is the ONE sanctioned way past —
# GitHub records who applied it and when, so the bypass leaves a trace. Disabling the
# ruleset to force a merge does not; it also unprotects the branch while it is off.
#
# What the gate must NEVER do is infer a review from elapsed time. Success comes from a
# real Copilot review, a dependency-bot exemption, or a human's explicit label — waiting
# longer is not evidence.
#
# Zero LLM calls; short-lived runs on the configured runner (self-hosted by default → no
# GitHub minutes; a repo without a self-hosted runner overrides "ubuntu-latest" to ubuntu-latest,
# which IS metered — the job is seconds-long, so the cost is negligible).
name: copilot-review-gate

on:
  # pull_request_TARGET, not pull_request (#136). On `pull_request`, GitHub evaluates the
  # workflow definition from the PR's own HEAD for same-repo PRs — so a PR could edit THIS FILE
  # to post `state: 'success'` unconditionally and satisfy the required check that exists to
  # judge it. CODEOWNERS on `.github/workflows/` meant such an edit could not merge unreviewed,
  # but that is a human noticing a diff, not the gate being unbypassable.
  #
  # `pull_request_target` runs the definition from the PROTECTED BASE BRANCH while still
  # receiving the PR payload, so a PR cannot alter the logic evaluating it. Safe here for one
  # specific reason, which must stay true: THIS JOB NEVER CHECKS OUT OR EXECUTES PR CODE. It
  # only reads reviews/statuses through the API. Adding a checkout of the PR head to this file
  # would hand a fork's code a writable token — do not.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  schedule:
    # Backstop greener. Scheduled runs can be delayed by GitHub under load, so this
    # is "green within a few minutes", not instant — fine, since blocking is exact.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  statuses: write        # post the copilot-review commit status
  pull-requests: read    # enumerate open PRs (schedule) + read reviews
  issues: read           # the #157 never-asked check reads the issue timeline; without this
                         # scope the call 403s and the gate silently falls back to the generic
                         # stale message — present but useless. Caught in review on the PR
                         # that added the check.

concurrency:
  # Per-PR for pull_request events; a single constant group for the scheduled sweep (and manual
  # dispatch). cancel-in-progress: only the latest state matters, so a newer run SUPERSEDES an
  # older one in the same group — this also prevents a run stuck waiting for a runner from
  # blocking every later run behind it (cancel-in-progress: false pile-up). No status races
  # either: at most one run per group is ever live.
  group: copilot-review-gate-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'sweep' }}
  cancel-in-progress: true

jobs:
  gate:
    # NO `if:` AT ALL — every trigger above should reach this job, and a job without a condition
    # always runs. The fork skip that used to live here is gone deliberately: it existed because
    # a fork's `pull_request` run got a read-only token, so the status POST 403'd and the
    # scheduled sweep had to cover those PRs minutes later. `pull_request_target` carries a
    # writable base-repo token even for forks, so a fork PR now gets its status immediately, by
    # the same path as any other — one less case where the answer arrives late and reads as a
    # dead gate.
    #
    # Written as an absent key rather than `if: true`, which YAML parses as a boolean where
    # Actions wants an expression string, and rather than `${{ true }}`, which is ceremony
    # around the absence of a condition.
    # FORK PRs GO TO A GITHUB-HOSTED RUNNER. Under `pull_request_target` this job runs for fork
    # PRs too (that is the point — they get their status immediately instead of waiting for the
    # sweep), but on a PUBLIC repo anyone can open one, and each would occupy a runner from the
    # shared self-hosted pool. That is a queue any stranger can fill.
    #
    # Measured when this was written: the only two public repos in the org already run this gate
    # on ubuntu-latest, so exposure was zero — by coincidence, not by design. Making a private
    # repo public, or giving either of those a self-hosted runner, would have silently removed
    # the protection. Expressed here so it holds regardless.
    #
    # The condition names the fork case explicitly rather than negating "same repo", because on
    # schedule and workflow_dispatch there is no pull_request payload at all and a negation
    # would send every sweep to a hosted runner.
    runs-on: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('"ubuntu-latest"') }}
    # Bound the worst case: a run that hangs on a self-hosted runner can't linger (belt-and-
    # braces with cancel-in-progress, which already supersedes a stuck run on the next trigger).
    timeout-minutes: 5
    steps:
      - name: Evaluate Copilot-review gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Minutes to wait for a Copilot review before the gate says it is not coming.
          # Set the repository variable COPILOT_REVIEW_STALE_MIN to tune; 0 disables the
          # stale state entirely and restores the old indefinite yellow.
          COPILOT_REVIEW_STALE_MIN: ${{ vars.COPILOT_REVIEW_STALE_MIN || '60' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            // The interval PROMISED in the pending status text. It is asserted against the cron
            // in TC-GATE-2, because a promise that can drift away from the schedule keeping it is
            // worse than no promise: it would tell a blocked human to wait for a tick that never
            // comes.
            const RECHECK_MIN = 5;
            // Match the Copilot reviewer by EXACT bot identity, not a substring — a human
            // login that merely contains "copilot" must never satisfy the required check.
            const isCopilot = (u) =>
              !!u && u.type === 'Bot' &&
              (u.login || '').toLowerCase().replace(/\[bot\]$/, '') === 'copilot-pull-request-reviewer';

            // Post copilot-review = success once Copilot has reviewed THIS head commit,
            // else pending. A new push moves the head, so a stale review on an older
            // commit no longer counts. Only writes when the state actually changes, so
            // the cron doesn't spam status history.
            async function evaluate(pr) {
              if (pr.draft) return;                    // drafts can't be reviewed by Copilot
              const sha = pr.head.sha;
              // Dependency-update bots (dependabot, renovate) are NEVER reviewed by Copilot —
              // GitHub excludes bot PRs from Copilot code review — so a required copilot-review
              // would deadlock them forever. Worse, a human/manual green is posted by a DIFFERENT
              // app and can't satisfy an app-pinned required check, so there is NO manual escape.
              // Pass them here, from THIS workflow (the very app the required check is pinned to),
              // so the check is satisfiable. Bumps stay gated by CI + auto-merge, their own
              // required checks — this only lifts the copilot-review deadlock.
              // ALLOWLIST, not "any Bot": bypassing every user.type==='Bot' PR would let ANY
              // GitHub App (github-actions[bot], a random third-party App) skip the Copilot gate
              // entirely. Only these known dependency bots — trusted, low-risk, Copilot-excluded —
              // are exempted; any other bot PR still waits for a real Copilot review.
              const DEP_BOTS = new Set(['dependabot', 'dependabot-preview', 'renovate', 'renovate-bot']);
              const login = (pr.user && pr.user.login || '').toLowerCase().replace(/\[bot\]$/, '');
              const isBot = !!pr.user && pr.user.type === 'Bot' && DEP_BOTS.has(login);
              const reviews = isBot ? [] : await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              // Only a genuinely-SUBMITTED review counts. listReviews keeps DISMISSED reviews,
              // and can surface a PENDING (started-but-not-submitted) review — neither means
              // "Copilot reviewed this commit", so exclude both. Real Copilot reviews are COMMENTED.
              const submitted = isBot ? [] : reviews.filter(
                (r) => isCopilot(r.user) && r.commit_id === sha
                  && r.state !== 'DISMISSED' && r.state !== 'PENDING',
              );
              // …and a SUBMITTED review is still not necessarily a review (#200). When Copilot
              // cannot review, it says so BY SUBMITTING A REVIEW that says so — state COMMENTED,
              // correct commit_id, genuinely from the Copilot bot. Every property the gate used
              // to test is satisfied by a refusal, because a refusal really is Copilot really
              // answering about this commit. The body is the only thing left that differs.
              // Two shapes measured live, both on real fleet PRs:
              //   "Copilot was unable to review this pull request because the user who requested
              //    the review has reached their quota limit."   — 13 PRs on one repo in one day,
              //                                                   all merged on a green check
              //   "Copilot wasn't able to review any files in this pull request."
              // Counting either makes the check assert "Copilot has reviewed this commit" when
              // Copilot said the opposite in the very object being counted. That is strictly
              // worse than the bypass label below: the label also greens, but it states plainly
              // that no review happened and records who decided that.
              //
              // THE FIRST LINE, not the whole body. Every genuine review measured (100+, eight
              // repos) opens with a markdown heading — "## Pull request overview", "### 🟢 Ready
              // to approve" — while a refusal IS its first sentence, alone. Testing the whole
              // body would let a PR that merely DISCUSSES quota limits produce a review whose
              // summary quotes the phrase, and the gate would refuse to green a PR for the
              // subject it is about. Length is not usable as a signal: a real review 119 bytes
              // long and a refusal 119 bytes long are both in the measured set.
              // Two alternatives, deliberately. The first catches the refusal SHAPE whatever the
              // reason turns out to be; the second catches a reason stated without that shape
              // ("Copilot has reached its quota limit for this repository"), which the first
              // would read as a normal review. A refusal wording this gate does not recognise
              // is a false green — the failure this whole change exists to remove — so the
              // detector is built to over-reach slightly rather than to miss.
              // NO \b BEFORE THE CONTRACTION. `\bn't able` cannot match inside "wasn't": the
              // position between `s` and `n` sits between two word characters, so there is no
              // boundary there, and the alternative silently never fires. Written with the
              // boundary it read as correct and passed nothing — caught by testing the second
              // measured refusal shape rather than only the common one.
              const QUOTA_RE = /\b(?:quota|rate)[ -]?limits?\b/i;
              const DECLINED_RE = new RegExp([
                /\bunable\s+to\s+review\b/.source,
                /(?:n[’']t|not|never)\s+able\s+to\s+review\b/.source,
                /\b(?:cannot|can[’']t|could\s*not|couldn[’']t|will\s*not|won[’']t)\s+review\b/.source,
                QUOTA_RE.source,
              ].join('|'), 'i');
              const firstLine = (b) => String(b || '').trim().split('\n')[0].trim();
              // Kept as TEXT, not a boolean: it is Copilot's own sentence, and an operator
              // reading the run log should see the reason in the words the producer used rather
              // than a classification of them.
              const declined = submitted.map((r) => firstLine(r.body)).find((l) => DECLINED_RE.test(l)) || null;
              // AN EMPTY BODY IS NOT A REVIEW EITHER, and it has to be excluded explicitly:
              // `DECLINED_RE.test('')` is false, so a blank first line would sail through the
              // negation below and green the check on a review that says nothing at all. That
              // is the same false green this whole change removes, re-entering through the one
              // input the detector cannot classify. Unobserved in 300 Copilot reviews measured
              // across the fleet — every one carries a body — so failing closed here costs
              // nothing today; failing open would cost exactly what #200 cost. If it ever does
              // happen the PR goes yellow and then stale, which is the honest state for "we
              // have no usable review", and the label is the way past. Caught in review.
              const reviewed = isBot || submitted.some((r) => {
                const line = firstLine(r.body);
                return !!line && !DECLINED_RE.test(line);
              });
              // Say which of the two it was. "Copilot answered with nothing" and "Copilot never
              // answered" produce the same yellow, and without this line the run log cannot tell
              // an operator which one they are looking at.
              if (!reviewed && !declined && submitted.length) {
                core.warning(`#${pr.number}: Copilot submitted ${submitted.length} review(s) for this head with an EMPTY body — not counted as a review`);
              }
              // THE ONE WAY OUT when Copilot will not review (#311). An operator applies
              // the label; the gate honours it and SAYS SO. GitHub records who applied it and
              // when, so the bypass carries its own audit trail — unlike disabling the ruleset,
              // which leaves the repository briefly unprotected and nothing behind.
              const BYPASS_LABEL = 'copilot-review-unavailable';
              const bypassed = (pr.labels || []).some(
                (l) => (l.name || '').toLowerCase() === BYPASS_LABEL);

              const combined = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
              const existing = combined.data.statuses.find((s) => s.context === 'copilot-review');
              const cur = existing?.state;

              // How long has this commit been waiting? Measured from when WE first posted
              // pending for this sha — not from the commit's own date, which a rebase makes
              // arbitrarily old and would declare a fresh push stale on arrival. Costs no
              // extra API call: the status we already fetched carries its own created_at.
              const STALE_MIN = Number(process.env.COPILOT_REVIEW_STALE_MIN || '60');
              const staleEnabled = Number.isFinite(STALE_MIN) && STALE_MIN > 0;
              const waitedMin = (existing && existing.state === 'pending')
                ? (Date.now() - Date.parse(existing.created_at)) / 60000
                : 0;
              // STICKY. Once the gate has said "not coming", it keeps saying it until a
              // review or the label actually arrives. Without this the next sweep reads
              // its own `failure`, measures a 0-minute wait, and flips back to `pending`
              // — the check would oscillate failure -> pending -> failure forever and the
              // distinct state would mean nothing. Setting STALE_MIN=0 still disables it
              // entirely, including un-sticking an existing failure.
              const alreadyStale = !!existing && existing.state === 'failure';
              // A REFUSAL SKIPS THE CLOCK, and does so regardless of staleEnabled. The clock
              // measures patience — how long a review may be late before the gate calls it
              // absent — and a refusal is not lateness, it is the answer. Waiting the full
              // window for a commit Copilot has already declined buys an hour of yellow and
              // then says exactly what it could have said at minute zero. STALE_MIN=0 turns
              // off the TIMEOUT, which is a judgement the gate makes about silence; it cannot
              // turn off a fact the producer stated. The way past a refusal is the label —
              // honest, audited — not a knob that makes the gate stop mentioning it.
              const stale = !reviewed && !bypassed
                && (!!declined || (staleEnabled && (alreadyStale || waitedMin >= STALE_MIN)));


              // NEVER green on an absent review. Success comes from a real Copilot review, a
              // dependency-bot exemption, or an operator's explicit label — never from waiting
              // long enough. `failure` here is not a verdict on the code: it is the gate saying
              // this will not clear on its own, which `pending` cannot express.
              const want = (reviewed || bypassed) ? 'success' : (stale ? 'failure' : 'pending');
              // BEFORE the timeline read below, on purpose. `failure` is sticky, so a stale PR
              // is re-evaluated every sweep for as long as it lives — and the never-asked
              // lookup used to run before this return, paying a timeline read per sweep per
              // stuck PR forever, to compute a description that would never be posted. Caught
              // in review on the fleet deploy. The read now happens exactly once: at the
              // pending -> failure transition, where the description is actually chosen.
              // …and it keys on STATE ALONE, which is not always the whole of what changed.
              // A PR the stale clock already failed sits at `failure`; if Copilot then submits
              // an explicit refusal, `want` is still `failure`, this returns, and the operator
              // keeps reading "No Copilot review after N min — check the AI-credit budget" while
              // the gate knows Copilot answered and why. Same state, different fact — and the
              // fact is the one they act on, since a quota refusal and a "no files I can review"
              // refusal have different remedies and neither is "wait". Caught in review.
              //
              // Narrow on purpose: only a decline that has not been said yet reopens the write.
              // Comparing full descriptions instead would repost on every sweep, because the
              // stale text carries the elapsed minutes and those keep changing — spam is exactly
              // what this early return exists to prevent.
              const declineAlreadySaid = /DECLINED/.test(existing?.description || '');
              if (cur === want && (!declined || declineAlreadySaid)) return;

              // #157: "not asked" and "asked and silent" are different failures with different
              // fixes, and the old message sent half its readers to the wrong one. The ruleset
              // requests Copilot at PR OPEN (+1s, measured on five PRs); review_on_push only
              // re-requests where Copilot is already a reviewer. A PR opened during an outage
              // therefore NEVER gets a request, and nothing recovers it — not a push, not a
              // reopen (four attempts measured on one stuck PR, over six hours, with Copilot
              // demonstrably reviewing elsewhere). Telling that reader to "check the AI-credit
              // budget" points at a budget that is already fine.
              //
              // Timeline read only on the stale path — the rare case pays, the common one not.
              let neverAsked = false;
              // NOT on the refusal path. A refusal is proof of the opposite — Copilot cannot
              // decline a review nobody asked it for — so the question the timeline answers is
              // already answered, and paying up to eleven timeline requests to re-derive a
              // `false` would be the same waste the placement of this block exists to avoid.
              if (stale && !declined) {
                try {
                  // Page-by-page with an EARLY EXIT, not github.paginate: one matching event
                  // answers the question, and paginate fetches the WHOLE timeline regardless.
                  // The difference bites exactly when this code runs — an outage means many
                  // stale PRs on one sweep, and full-timeline reads there multiply API calls
                  // toward the rate limit. Caught in review on the fleet deploy.
                  // The REQUEST names the reviewer 'Copilot' (measured live: five PRs, every
                  // timeline shows requested_reviewer.login === 'Copilot'); the REVIEW is later
                  // submitted by 'copilot-pull-request-reviewer[bot]'. Two identities, one bot.
                  // Both are accepted here so a GitHub-side rename of either never silently
                  // turns every stale PR into "never asked".
                  const copilotLogins = ['copilot', 'copilot-pull-request-reviewer'];
                  const askedFor = (e) => e.event === 'review_requested'
                    && copilotLogins.includes((e.requested_reviewer?.login || '').toLowerCase().replace(/\[bot\]$/, ''));
                  // ONE SOURCE FOR THE CAP. The probe below has to ask for the first event
                  // PAST everything this loop could have seen, so the two are arithmetically
                  // bound. Written as separate literals they can drift apart silently, and
                  // the drift is not symmetric: SHRINKING the cap would make the probe ask
                  // beyond the real scan, come back empty, and let the gate declare "Copilot
                  // was never asked" about events it never looked at — a confident wrong
                  // verdict that sends someone to close a recoverable PR. Derived here so
                  // that cannot happen.
                  const TIMELINE_PAGE_SIZE = 100;
                  const TIMELINE_MAX_PAGES = 10;
                  let asked = false;
                  let sawEnd = false;
                  for (let page = 1; page <= TIMELINE_MAX_PAGES && !asked; page++) {
                    const { data: tl } = await github.rest.issues.listEventsForTimeline(
                      { owner, repo, issue_number: pr.number, per_page: TIMELINE_PAGE_SIZE, page });
                    asked = tl.some(askedFor);
                    if (tl.length < TIMELINE_PAGE_SIZE) { sawEnd = true; break; }
                  }
                  // "Never asked" is a claim about the WHOLE timeline, so it may only be made
                  // after seeing the end of it. A scan that hits the page cap without finding
                  // the event proves nothing — the request may sit on page 11 — and the wrong
                  // verdict here sends someone to close a perfectly recoverable PR. Incomplete
                  // scan -> unknown -> the generic message, same as an unreadable timeline.
                  // A timeline whose length is EXACTLY the cap fills the last page completely,
                  // so the loop ends with sawEnd false and reads identical to a truncated scan
                  // — even though nothing was missed. Costing a PR its specific remedy, and
                  // logging a warning that is simply untrue, on an exact multiple of the page
                  // size is a bad trade against one extra request made only in that rare case:
                  // ask for the page AFTER the last one scanned. Empty means the timeline
                  // really did end there.
                  //
                  // Stated without numbers on purpose. An earlier draft said "exactly 1000
                  // events" and "page 10" — restating in prose the very constants that were
                  // just extracted so they could not drift apart. A comment carrying its own
                  // copy of the arithmetic goes stale the same way the literals would have,
                  // except nothing fails when it does.
                  if (!asked && !sawEnd) {
                    // THE NEXT PAGE, not a deep offset. An EARLIER VERSION of these two lines
                    // asked for the thousand-and-first single-item page — arithmetically the
                    // same position as the page after the last one scanned, but expressed in a
                    // shape the API is not built for. The request below is that same position,
                    // said plainly, and it costs one fewer derived constant to keep in step.
                    //
                    // Written in the past tense on purpose: the previous wording opened with
                    // "This asked for …" and read as a description of the code directly beneath
                    // it, which is the one thing a comment must never be wrong about.
                    const { data: past } = await github.rest.issues.listEventsForTimeline(
                      { owner, repo, issue_number: pr.number,
                        per_page: TIMELINE_PAGE_SIZE, page: TIMELINE_MAX_PAGES + 1 });
                    sawEnd = past.length === 0;
                  }
                  if (asked || sawEnd) {
                    neverAsked = !asked;
                  } else {
                    core.warning(`#${pr.number}: timeline exceeds the scan cap — cannot confirm never-asked; keeping the generic stale message`);
                  }
                } catch (e) {
                  // Cannot tell the two apart -> keep the generic message rather than guess.
                  core.warning(`#${pr.number}: timeline unreadable (${e?.message ?? String(e)}) — cannot distinguish never-asked from silent`);
                }
              }

              // VERBATIM, in the run log, because a status description is capped at 140 bytes
              // and the remediation has to fit inside it. Copilot's own sentence names the
              // account and the limit; classifying it down to "declined" and dropping the words
              // is how an operator ends up asking whether it is a bug or a real limit — an hour
              // lost to exactly that, on this gate, is why the log keeps the original.
              if (stale && declined) core.warning(`#${pr.number}: Copilot DECLINED this commit — "${declined}"`);

              try {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha, state: want, context: 'copilot-review',
                  description: isBot
                    ? 'Bot PR — Copilot does not review bot PRs; gated by CI'
                    : bypassed
                      ? `Bypassed via "${BYPASS_LABEL}" — Copilot did NOT review this commit`
                      : reviewed
                        ? 'Copilot has reviewed this commit'
                        // Named separately from the ordinary stale message because the remedies
                        // differ, the same way never-asked differs from silent. A quota refusal
                        // points at the budget; a "no files I can review" refusal will never
                        // change for this commit no matter what the budget does, and sending
                        // that reader to check billing wastes the trip.
                        : declined
                          ? (QUOTA_RE.test(declined)
                            ? `Copilot DECLINED this commit — quota/rate limit; check the AI-credit budget, then label "${BYPASS_LABEL}"`
                            : `Copilot DECLINED to review this commit — it will not clear itself; label "${BYPASS_LABEL}" to proceed`)
                          : stale
                            ? (neverAsked
                              ? `Copilot was never asked (outage at open?) — close this PR, open a new one from the branch, or label "${BYPASS_LABEL}"`
                              : `No Copilot review after ${Math.round(waitedMin)} min — check the AI-credit budget, then label "${BYPASS_LABEL}"`)
                          // SAY THAT IT IS ALIVE. This text is all a human gets while blocked, and
                          // "Waiting…" cannot distinguish a gate that will clear itself in two
                          // minutes from one that is dead — it reads identically in both cases, so
                          // the rational move is to go ask an operator. That is exactly what kept
                          // happening. The greener is the CRON, not the review event (see the
                          // header: bot-triggered runs are held as `action_required` and never
                          // execute), so a few minutes of yellow AFTER Copilot finishes is the
                          // design working, not a fault. Naming the interval turns an unbounded
                          // unknown into a bounded wait.
                          // "about", not "every". The schedule below is a REQUEST: GitHub
                          // delays cron under load, as the header of this file says plainly.
                          // The point of this text is to turn an unbounded unknown into a
                          // bounded wait, and a bound that quietly fails to hold does the
                          // opposite — the operator who waited six minutes for a promised
                          // five now has fresh reason to think the gate is dead. Naming the
                          // interval as approximate keeps the reassurance and drops the claim
                          // I cannot keep.
                            : `Waiting for Copilot code review… (rechecked about every ${RECHECK_MIN} min; yellow until then is normal)`,
                });
                core.info(`#${pr.number} ${sha.slice(0, 8)} copilot-review=${want}`);
              } catch (e) {
                // Don't fail the job on a failed POST: a not-yet-posted required check is
                // still blocking, which is the correct state to be in while something is wrong.
                // A 403 USED to be routine: a fork's `pull_request` run got a read-only token,
                // the POST was denied, and the scheduled sweep covered it minutes later. Under
                // `pull_request_target` (#136) every run — fork included — carries a writable
                // base-repo token, so that reason is gone and a denial now means something real:
                // a revoked permission, an org policy, a token scope change. Downgrading it to
                // info would keep the gate quiet about the one failure that stops it posting at
                // all, which is how a broken gate reads as a working one.
                // `e.status` alone is not enough: a network failure, a DNS problem or an
                // unexpected exception carries no status at all, so the warning read
                // "could not post status (undefined)" — true, useless, and on the one path that
                // silences the gate entirely. The message is what says which of those it was.
                // OPTIONAL CHAINING, because JavaScript lets you throw anything — including
                // null and undefined. `e.status` on a thrown null is a TypeError raised INSIDE
                // the handler whose entire job is to keep a failed POST from failing the run:
                // the catch would take down the thing it exists to protect, and the original
                // error would never be printed. Verified: reading .status off a thrown null
                // raises TypeError.
                const status = e?.status ?? 'none';
                const detail = e?.message ?? String(e);
                core.warning(`could not post status for #${pr.number} (status=${status}): ` +
                  `${detail} — UNEXPECTED; pull_request_target carries a writable token, ` +
                  'so this is not the old fork denial');
              }
            }

            if (context.payload.pull_request) {
              await evaluate(context.payload.pull_request);
            } else {
              // schedule / manual: sweep every open PR. Isolate each PR — one PR's API failure
              // must NOT abort the whole sweep and strand the others' statuses until next run.
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
              });
              for (const pr of prs) {
                try { await evaluate(pr); }
                // Same optional chaining as the POST handler below: this catch is the sweep's
                // isolation boundary — one PR's failure must not abort the others — so it must
                // survive a thrown null, which reading `.message` directly does not.
                catch (e) { core.warning(`#${pr.number}: evaluate failed — ${e?.message ?? String(e)}`); }
              }
            }
